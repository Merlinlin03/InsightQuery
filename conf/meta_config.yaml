  "metrics": [
    {
      "name": "开播用户数",
      "description": "周期内started=1的去重user_id；按剧集分析时先关联dim_episode和dim_series。",
      "relevant_columns": [
        {
          "t_name": "fact_episode_view",
          "c_name": "user_id"
        },
        {
          "t_name": "fact_episode_view",
          "c_name": "started"
        },
        {
          "t_name": "fact_episode_view",
          "c_name": "episode_id"
        }
      ],
      "alias": [
        "观看用户",
        "播放用户"
      ]
    },
    {
      "name": "次集续看率",
      "description": "同一周期、同一剧中观看第1集的用户里，继续观看第2集的去重用户数 / 观看第1集的去重用户数；按用户匹配，不平均各剧比率。",
      "relevant_columns": [
        {
          "t_name": "fact_episode_view",
          "c_name": "user_id"
        },
        {
          "t_name": "fact_episode_view",
          "c_name": "episode_id"
        },
        {
          "t_name": "dim_episode",
          "c_name": "episode_no"
        },
        {
          "t_name": "dim_episode",
          "c_name": "series_id"
        }
      ],
      "alias": [
        "第2集续看率",
        "二集续看率"
      ]
    },
    {
      "name": "单集完播率",
      "description": "sum(completed) / nullif(sum(started),0)，分析时限定相同集数、市场与日期窗口。",
      "relevant_columns": [
        {
          "t_name": "fact_episode_view",
          "c_name": "completed"
        },
        {
          "t_name": "fact_episode_view",
          "c_name": "started"
        },
        {
          "t_name": "fact_episode_view",
          "c_name": "episode_id"
        }
      ],
      "alias": [
        "完播率"
      ]
    },
    {
      "name": "付费墙展示用户数",
      "description": "event_type='impression'的去重user_id；按剧集与市场拆解时保留同一统计粒度。",
      "relevant_columns": [
        {
          "t_name": "fact_paywall_event",
          "c_name": "user_id"
        },
        {
          "t_name": "fact_paywall_event",
          "c_name": "event_type"
        },
        {
          "t_name": "fact_paywall_event",
          "c_name": "episode_id"
        }
      ],
      "alias": [
        "付费墙曝光用户"
      ]
    },
    {
      "name": "成功解锁用户数",
      "description": "status='success'的去重user_id；失败交易不计入。",
      "relevant_columns": [
        {
          "t_name": "fact_purchase",
          "c_name": "user_id"
        },
        {
          "t_name": "fact_purchase",
          "c_name": "status"
        },
        {
          "t_name": "fact_purchase",
          "c_name": "episode_id"
        }
      ],
      "alias": [
        "付费用户",
        "解锁用户"
      ]
    },
    {
      "name": "付费解锁转化率",
      "description": "同一周期、同一剧集中付费墙展示用户里成功解锁的去重用户数 / 付费墙展示去重用户数；按用户匹配，零分母返回不可计算，不直接平均分组比率。",
      "relevant_columns": [
        {
          "t_name": "fact_purchase",
          "c_name": "user_id"
        },
        {
          "t_name": "fact_purchase",
          "c_name": "status"
        },
        {
          "t_name": "fact_paywall_event",
          "c_name": "user_id"
        },
        {
          "t_name": "fact_paywall_event",
          "c_name": "event_type"
        }
      ],
      "alias": [
        "付费墙转化率",
        "解锁转化率"
      ]
    },
    {
      "name": "成功解锁收入",
      "description": "sum(fact_purchase.amount_usd) where status='success'，单位美元；失败交易不计入，按剧集/市场分项金额可加总。",
      "relevant_columns": [
        {
          "t_name": "fact_purchase",
          "c_name": "amount_usd"
        },
        {
          "t_name": "fact_purchase",
          "c_name": "status"
        },
        {
          "t_name": "fact_purchase",
          "c_name": "episode_id"
        }
      ],
      "alias": [
        "短剧收入",
        "付费收入",
        "解锁收入"
      ]
    }
  ]
}
